<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - SocialGraph & Prezentatsiya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK (Version 9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Konfiguratsiyasi (O'zingizning Firebase loyihangiz kalitlarini qo'yishingiz mumkin)
        const firebaseConfig = {
            databaseURL: "https://socialgraph-demo-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbRemove = remove;
        window.dbUpdate = update;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-40 border-b border-slate-800/80 px-6 py-3.5 flex items-center justify-between shadow-2xl">
        <div class="flex items-center space-x-3">
            <div class="p-2.5 bg-gradient-to-tr from-cyan-600 to-blue-600 rounded-xl text-white">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg leading-tight text-white">ADMIN PANELI</h1>
                <p class="text-xs text-cyan-400 font-medium">Talaba tizimini real-vaqtda boshqarish</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="clearAllData()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg text-xs font-semibold">
                Barchasini Tozalash
            </button>
        </div>
    </header>

    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-[1700px] mx-auto w-full">
        <!-- Rejimlar va Boshqaruv -->
        <aside class="lg:col-span-3 space-y-5">
            <div class="glass-panel p-4 rounded-2xl border border-slate-800">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Tahrirlash Asboblari</h3>
                <div class="grid grid-cols-4 gap-1 p-1 bg-slate-900 rounded-xl">
                    <button id="mode-select" onclick="setMode('select')" class="py-2 text-[11px] font-bold text-white bg-cyan-600 rounded-lg">Ko'chirish</button>
                    <button id="mode-node" onclick="setMode('node')" class="py-2 text-[11px] font-bold text-slate-400 hover:text-white">+ Tugun</button>
                    <button id="mode-edge" onclick="setMode('edge')" class="py-2 text-[11px] font-bold text-slate-400 hover:text-white">+ Aloqa</button>
                    <button id="mode-delete" onclick="setMode('delete')" class="py-2 text-[11px] font-bold text-red-400 hover:bg-red-500/10 rounded-lg">O'chirish</button>
                </div>
            </div>

            <!-- Prezentatsiya Narxlarini Boshqarish -->
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center space-x-1">
                    <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                    <span>Prezentatsiya Narxlarini Sozlash</span>
                </h3>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Standart Tarif (5 slayd):</label>
                    <input type="number" id="price-plan1" value="30000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Optimal Tarif (8 slayd):</label>
                    <input type="number" id="price-plan2" value="50000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">Premium Tarif (12 slayd):</label>
                    <input type="number" id="price-plan3" value="80000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white">
                </div>
                <button onclick="updatePricesInDB()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs">
                    Narxlarni Saqlash (Talabada Yangilanadi)
                </button>
            </div>
        </aside>

        <!-- Canvas -->
        <section class="lg:col-span-6 flex flex-col">
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex-1 flex flex-col min-h-[500px] relative">
                <div class="flex-1 relative w-full h-full min-h-[450px] bg-slate-950/60 rounded-xl overflow-hidden border border-slate-900" id="canvas-container">
                    <canvas id="graphCanvas" class="w-full h-full block cursor-crosshair"></canvas>
                </div>
            </div>
        </section>

        <!-- Admin Tahrirlash Ro'yxati -->
        <aside class="lg:col-span-3 space-y-5">
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Tugunni Tahrirlash</h3>
                <div id="selected-node-info" class="p-3 bg-slate-900 rounded-xl text-xs text-slate-400 text-center">
                    Tahrirlash uchun grafikdan tugunni bosing.
                </div>
            </div>
            <div class="glass-panel p-4 rounded-2xl border border-slate-800 space-y-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Aloqalar Ro'yxati (Admin)</h3>
                <div id="edges-list" class="space-y-2 max-h-[300px] overflow-y-auto pr-1"></div>
            </div>
        </aside>
    </main>

    <script>
        let nodes = [], edges = [];
        let mode = 'select', selectedNode = null, edgeStartNode = null, draggedNode = null;
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const namePool = ["Anvar", "Barchin", "Diyor", "Eldor", "Feruza", "Gulnoza", "Hasan", "Jasur"];

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            resizeCanvas();
            setTimeout(initFirebaseSync, 1000);
        });

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            if (container) { canvas.width = container.clientWidth; canvas.height = container.clientHeight; drawGraph(); }
        }
        window.addEventListener('resize', resizeCanvas);

        function initFirebaseSync() {
            if (!window.db) return;
            // Realtime Sync from DB
            window.dbOnValue(window.dbRef(window.db, 'graphData'), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    nodes = data.nodes || [];
                    edges = data.edges || [];
                    drawGraph();
                    renderEdgesAdminList();
                }
            });
        }

        function syncToFirebase() {
            if (!window.db) return;
            window.dbSet(window.dbRef(window.db, 'graphData'), { nodes, edges });
        }

        function updatePricesInDB() {
            const p1 = document.getElementById('price-plan1').value;
            const p2 = document.getElementById('price-plan2').value;
            const p3 = document.getElementById('price-plan3').value;
            window.dbSet(window.dbRef(window.db, 'prices'), { plan1: p1, plan2: p2, plan3: p3 });
            alert("Narxlar muvaffaqiyatli saqlandi! Talabalar ekranida yangilandi.");
        }

        function setMode(m) {
            mode = m;
            ['select', 'node', 'edge', 'delete'].forEach(item => {
                const btn = document.getElementById(`mode-${item}`);
                if (btn) btn.className = (item === m) ? 'py-2 text-[11px] font-bold text-white bg-cyan-600 rounded-lg' : 'py-2 text-[11px] font-bold text-slate-400 hover:text-white';
            });
            edgeStartNode = null; drawGraph();
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            edges.forEach(edge => {
                const u = nodes.find(n => n.id === edge.from), v = nodes.find(n => n.id === edge.to);
                if (!u || !v) return;
                ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(v.x, v.y);
                ctx.strokeStyle = 'rgba(71, 85, 105, 0.6)'; ctx.lineWidth = 2; ctx.stroke();

                const midX = (u.x + v.x) / 2, midY = (u.y + v.y) / 2;
                ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(midX, midY, 10, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = '#cbd5e1'; ctx.font = '600 11px "Plus Jakarta Sans"';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(edge.weight, midX, midY);
            });

            nodes.forEach(node => {
                const isSelected = selectedNode && selectedNode.id === node.id;
                ctx.beginPath(); ctx.arc(node.x, node.y, 22, 0, 2 * Math.PI);
                ctx.fillStyle = isSelected ? '#0d9488' : '#1e293b'; ctx.fill();
                ctx.lineWidth = isSelected ? 3 : 2; ctx.strokeStyle = isSelected ? '#2dd4bf' : '#475569'; ctx.stroke();
                ctx.fillStyle = '#ffffff'; ctx.font = '600 11px "Plus Jakarta Sans"';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(node.name, node.x, node.y);
            });
        }

        let isMouseDown = false;
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            const clickedNode = nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) <= 24);
            isMouseDown = true;

            if (mode === 'select') {
                selectedNode = clickedNode || null; draggedNode = clickedNode || null;
                renderAdminNodePanel();
            } else if (mode === 'node' && !clickedNode) {
                const newId = nodes.length > 0 ? Math.max(...nodes.map(n => n.id)) + 1 : 1;
                nodes.push({ id: newId, name: namePool[(newId - 1) % namePool.length], x: pos.x, y: pos.y });
                syncToFirebase();
            } else if (mode === 'edge' && clickedNode) {
                if (!edgeStartNode) { edgeStartNode = clickedNode; }
                else if (edgeStartNode.id !== clickedNode.id) {
                    const weight = parseInt(prompt("Aloqa vaznini kiriting:", "1"), 10) || 1;
                    edges.push({ from: edgeStartNode.id, to: clickedNode.id, weight });
                    edgeStartNode = null; syncToFirebase();
                }
            } else if (mode === 'delete' && clickedNode) {
                nodes = nodes.filter(n => n.id !== clickedNode.id);
                edges = edges.filter(e => e.from !== clickedNode.id && e.to !== clickedNode.id);
                syncToFirebase();
            }
            drawGraph();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isMouseDown && draggedNode && mode === 'select') {
                const rect = canvas.getBoundingClientRect();
                draggedNode.x = e.clientX - rect.left; draggedNode.y = e.clientY - rect.top;
                drawGraph();
            }
        });
        window.addEventListener('mouseup', () => {
            if (draggedNode) syncToFirebase();
            isMouseDown = false; draggedNode = null;
        });

        function renderAdminNodePanel() {
            const box = document.getElementById('selected-node-info');
            if (!selectedNode) { box.innerHTML = `<p class="text-xs text-slate-400 text-center">Tahrirlash uchun grafikdan tugunni bosing.</p>`; return; }
            box.innerHTML = `
                <div class="space-y-2">
                    <span class="text-xs font-bold text-cyan-400">Tugun #${selectedNode.id}</span>
                    <input type="text" id="edit-node-name" value="${selectedNode.name}" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white">
                    <button onclick="saveNodeEdit()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-1 rounded-lg text-xs">Saqlash</button>
                </div>
            `;
        }

        function saveNodeEdit() {
            if (!selectedNode) return;
            const newName = document.getElementById('edit-node-name').value.trim();
            if (newName) { selectedNode.name = newName; syncToFirebase(); renderAdminNodePanel(); }
        }

        function renderEdgesAdminList() {
            const container = document.getElementById('edges-list'); container.innerHTML = '';
            edges.forEach((edge, idx) => {
                const u = nodes.find(n => n.id === edge.from), v = nodes.find(n => n.id === edge.to);
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 bg-slate-900 rounded-xl text-xs";
                div.innerHTML = `<span class="text-slate-300">${u?.name || edge.from} ➔ ${v?.name || edge.to} (${edge.weight})</span>
                <button onclick="deleteEdge(${idx})" class="text-red-400">🗑️</button>`;
                container.appendChild(div);
            });
        }

        function deleteEdge(idx) { edges.splice(idx, 1); syncToFirebase(); }
        function clearAllData() { nodes = []; edges = []; syncToFirebase(); }
    </script>
</body>
</html>

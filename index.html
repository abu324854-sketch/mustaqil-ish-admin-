<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduProjects - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .dark body { background: #070a13; color: #f8fafc; }
    .glass-card { background: rgba(15,23,42,.85); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(16px); }
    .inp { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: .75rem; padding: .6rem .75rem; font-size: .75rem; color: #fff; outline: none; }
    .inp:focus { border-color: #6366f1; }
  </style>
</head>
<body class="p-4 max-w-4xl mx-auto space-y-6">
  <header class="glass-card p-4 rounded-2xl flex justify-between items-center">
    <h1 class="text-base font-bold text-indigo-400"><i class="fa-solid fa-shield-halved"></i> EduProjects Admin Panel</h1>
    <div class="text-xs text-slate-400" id="adminStats">Yuklanmoqda...</div>
  </header>

  <!-- LLOYIHA YOKI SILKA QO'SHISH -->
  <section class="glass-card p-5 rounded-2xl space-y-4">
    <h2 class="text-sm font-bold text-indigo-300"><i class="fa-solid fa-plus-circle"></i> Yangi Loyiha yoki Veb-sayt Silkasini Qo'shish</h2>
    <form onsubmit="addNewProject(event)" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <input type="text" id="pTitle" required placeholder="Loyiha nomi" class="inp">
        <input type="text" id="pCategory" required placeholder="Kategoriya (masalan: Dasturlash)" class="inp">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <input type="number" id="pPrice" required placeholder="Narxi (UZS)" class="inp">
        <input type="text" id="pUrl" placeholder="Veb-sayt silkasi (https://...) — ixtiyoriy" class="inp">
      </div>
      <textarea id="pDesc" rows="2" placeholder="Qisqacha tavsif" class="inp"></textarea>
      <div class="flex items-center gap-2">
        <label class="text-xs text-slate-400">Fayl biriktirish (agar silka bo'lmasa):</label>
        <input type="file" id="pFile" class="text-xs text-slate-400">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-xs font-bold text-white">Loyihani Qo'shish</button>
    </form>
  </section>

  <!-- KUTILAYOTGAN TO'LOVLAR -->
  <section class="glass-card p-5 rounded-2xl space-y-4">
    <h2 class="text-sm font-bold text-amber-400"><i class="fa-solid fa-receipt"></i> To'lov Cheklari (Tasdiqlash Kutilmoqda)</h2>
    <div id="pendingPurchases" class="space-y-3">
      <div class="text-xs text-slate-500">Kutilayotgan to'lovlar yo'q.</div>
    </div>
  </section>

  <!-- BARCHA YUKLANGAN LOYIHALAR VA FAYLLAR -->
  <section class="glass-card p-5 rounded-2xl space-y-4">
    <h2 class="text-sm font-bold text-emerald-400"><i class="fa-solid fa-folder-tree"></i> Barcha Yuklangan Loyihalar (Eski va Yangi fayllar)</h2>
    <div id="adminProjectsList" class="space-y-2">
      <div class="text-xs text-slate-500">Loyihalar yuklanmoqda...</div>
    </div>
  </section>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMmB0tW-JGizWSOdlFJJd68p6sksrlS_8",
      authDomain: "mustaqil-ish-63c2c.firebaseapp.com",
      projectId: "mustaqil-ish-63c2c",
      databaseURL: "https://mustaqil-ish-63c2c-default-rtdb.firebaseio.com",
      storageBucket: "mustaqil-ish-63c2c.firebasestorage.app",
      messagingSenderId: "577427329404",
      appId: "1:577427329404:web:e3ac004474ff1c9d5454f9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const $ = id => document.getElementById(id);

    // Loyihalar va cheklarni yuklash
    db.ref('projects').on('value', snap => {
      const data = snap.val();
      const projects = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      
      $('adminStats').textContent = `Jami loyihalar: ${projects.length} ta`;
      
      if (!projects.length) {
        $('adminProjectsList').innerHTML = '<div class="text-xs text-slate-500">Hali loyihalar qo\'shilmagan.</div>';
        return;
      }

      $('adminProjectsList').innerHTML = projects.reverse().map(p => `
        <div class="bg-slate-900/60 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
          <div>
            <div class="font-bold text-white">${esc(p.title)} <span class="text-[10px] text-indigo-400">(${esc(p.category)})</span></div>
            <div class="text-[10px] text-slate-400">Narxi: ${Number(p.price).toLocaleString()} UZS · ${p.fileUrl ? '🌐 Silka mavjud' : '📁 Fayl mavjud'}</div>
          </div>
          <button onclick="deleteProject('${p.id}')" class="bg-rose-600/20 text-rose-400 px-3 py-1 rounded-lg text-xs hover:bg-rose-600 hover:text-white">O'chirish</button>
        </div>
      `).join('');
    });

    // To'lovlarni kuzatish
    db.ref('purchases').on('value', snap => {
      const data = snap.val();
      const purchases = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
      const pending = purchases.filter(p => p.status === 'pending');

      if (!pending.length) {
        $('pendingPurchases').innerHTML = '<div class="text-xs text-slate-500">Yangi to\'lov cheklari yo\'q.</div>';
        return;
      }

      $('pendingPurchases').innerHTML = pending.map(r => `
        <div class="bg-slate-900 border border-amber-500/30 p-3 rounded-xl flex flex-col gap-2 text-xs">
          <div class="flex justify-between">
            <span><b>${esc(r.studentName)}</b> (${esc(r.studentContact)})</span>
            <span class="text-amber-400 font-bold">${Number(r.paidAmount).toLocaleString()} UZS</span>
          </div>
          ${r.receiptData ? `<a href="${r.receiptData}" target="_blank" class="text-indigo-400 underline">Chek rasmini ko'rish</a>` : ''}
          <div class="flex gap-2 mt-1">
            <button onclick="updatePurchase('${r.id}', 'approved')" class="bg-emerald-600 text-white px-3 py-1 rounded-lg font-bold">Tasdiqlash</button>
            <button onclick="updatePurchase('${r.id}', 'revoked')" class="bg-rose-600 text-white px-3 py-1 rounded-lg">Rad etish</button>
          </div>
        </div>
      `).join('');
    });

    async function addNewProject(e) {
      e.preventDefault();
      const title = $('pTitle').value.trim();
      const category = $('pCategory').value.trim();
      const price = Number($('pPrice').value);
      const description = $('pDesc').value.trim();
      const fileUrl = $('pUrl').value.trim();
      const fileInput = $('pFile').files[0];

      let fileData = null;
      let fileName = null;

      if (fileInput) {
        fileName = fileInput.name;
        fileData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.readAsDataURL(fileInput);
        });
      }

      await db.ref('projects').push({
        title, category, price, description, fileUrl: fileUrl || null, fileData, fileName, createdAt: Date.now()
      });

      alert("Muvaffaqiyatli qo'shildi!");
      e.target.reset();
    }

    async function updatePurchase(id, status) {
      await db.ref('purchases/' + id).update({ status });
      alert("Holat yangilandi: " + status);
    }

    async function deleteProject(id) {
      if (confirm("Haqiqatan ham o'chirmoqchimisiz?")) {
        await db.ref('projects/' + id).remove();
        alert("O'chirildi!");
      }
    }

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  </script>
</body>
</html>

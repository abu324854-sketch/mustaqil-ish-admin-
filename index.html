<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO Admin Control Panel - EduProjects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    body { background-color: #070a12; color: #f8fafc; font-family: sans-serif; }
    .glass-box { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: rgba(30, 41, 59, 0.95); border-left: 4px solid #6366f1; color: white; padding: 12px 16px; border-radius: 12px; font-size: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  </style>
</head>
<body class="pb-20">
  <div id="toastContainer"></div>

  <header class="sticky top-0 z-40 glass-box px-4 py-4 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <span class="bg-indigo-600/20 text-indigo-400 p-2.5 rounded-2xl border border-indigo-500/20">
        <i class="fa-solid fa-shield-halved text-xl"></i>
      </span>
      <div>
        <h1 class="text-sm font-bold text-white leading-tight">Admin Control Panel</h1>
        <p class="text-[10px] text-slate-400">Fattoxov Abdulloh Toxirjon o'g'li • EduProjects</p>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
    <div class="grid grid-cols-2 gap-3">
      <div class="glass-box p-4 rounded-2xl border border-slate-800">
        <div class="text-[10px] text-slate-400 uppercase font-semibold">Tushgan So'rovlar</div>
        <div class="text-xl font-extrabold text-white mt-1" id="statPending">0</div>
      </div>
      <div class="glass-box p-4 rounded-2xl border border-slate-800">
        <div class="text-[10px] text-emerald-400 uppercase font-semibold">Jami Daromad</div>
        <div class="text-lg font-extrabold text-emerald-400 mt-1" id="statRevenue">0 UZS</div>
      </div>
    </div>

    <!-- AI PREMIUM NARXINI BELGILASH -->
    <div class="glass-box p-5 rounded-3xl border border-slate-800">
      <h2 class="text-xs font-bold text-white mb-4 flex items-center gap-2 uppercase tracking-wider">
        <i class="fa-solid fa-robot text-indigo-400 text-sm"></i> AI Premium Obuna Narxini Sozlash
      </h2>
      <form onsubmit="saveAiPrice(event)" class="space-y-3">
        <input type="number" id="aiPriceInput" required placeholder="1 oylik Premium narxi (UZS)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
          Narxni Saqlash
        </button>
      </form>
    </div>

    <!-- KARTALAR -->
    <div class="glass-box p-5 rounded-3xl border border-slate-800">
      <h2 class="text-xs font-bold text-white mb-4 flex items-center gap-2 uppercase tracking-wider">
        <i class="fa-solid fa-credit-card text-emerald-400 text-sm"></i> Karta Raqamlari
      </h2>
      <form onsubmit="saveCard(event)" class="space-y-3">
        <input type="text" id="cNumber" required placeholder="Karta raqami (8600 ...)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="cHolder" required placeholder="F.I.O" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none">
          <input type="text" id="cBank" required placeholder="Bank" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
          Karta Qo'shish
        </button>
      </form>
      <div id="adminCardsList" class="mt-3 space-y-2"></div>
    </div>

    <!-- LOYIHALAR -->
    <div class="glass-box p-5 rounded-3xl border border-slate-800">
      <h2 class="text-xs font-bold text-white mb-4 flex items-center gap-2 uppercase tracking-wider">
        <i class="fa-solid folder-open text-indigo-400 text-sm"></i> Barcha Loyihalar
      </h2>
      <div id="adminProjectsList" class="space-y-3"></div>
    </div>

    <!-- TO'LOVLAR -->
    <div class="glass-box p-5 rounded-3xl border border-slate-800">
      <h2 class="text-xs font-bold text-white mb-4 flex items-center gap-2 uppercase tracking-wider">
        <i class="fa-solid fa-receipt text-amber-400 text-sm"></i> To'lovlar va Ruxsatlar
      </h2>
      <div id="requestsList" class="space-y-3"><div class="text-center text-slate-500 text-xs py-4">Yuklanmoqda...</div></div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDMmB0tW-JGizWSOdlFJJd68p6sksrlS_8",
      authDomain: "mustaqil-ish-63c2c.firebaseapp.com",
      projectId: "mustaqil-ish-63c2c",
      databaseURL: "https://mustaqil-ish-63c2c-default-rtdb.firebaseio.com",
      storageBucket: "mustaqil-ish-63c2c.firebasestorage.app",
      messagingSenderId: "577427329404",
      appId: "1:577427329404:web:e3ac004474ff1c9d5454f9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let projectsMap = {};

    function showToast(message, type = 'indigo') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast border-l-4 border-${type}-500`;
      toast.innerHTML = `<i class="fa-solid fa-circle-check mr-2 text-${type}-400"></i> ${message}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    db.ref("settings/ai_price").on("value", snap => {
      if(snap.val()) document.getElementById('aiPriceInput').value = snap.val();
    });

    function saveAiPrice(e) {
      e.preventDefault();
      const val = Number(document.getElementById('aiPriceInput').value);
      db.ref("settings/ai_price").set(val).then(() => {
        showToast("AI Premium narxi yangilandi!", "emerald");
      });
    }

    function saveCard(e) {
      e.preventDefault();
      db.ref("settings/cards").push().set({
        number: document.getElementById('cNumber').value,
        holder: document.getElementById('cHolder').value,
        bank: document.getElementById('cBank').value
      }).then(() => { showToast("Karta qo'shildi!", "emerald"); e.target.reset(); });
    }

    db.ref("settings/cards").on("value", snapshot => {
      const container = document.getElementById('adminCardsList');
      container.innerHTML = '';
      const data = snapshot.val();
      if(data) {
        Object.keys(data).forEach(k => {
          const c = data[k];
          container.innerHTML += `<div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs"><div><span class="font-bold text-white">${c.number}</span></div><button onclick="db.ref('settings/cards/${k}').remove()" class="text-rose-400"><i class="fa-solid fa-trash"></i></button></div>`;
        });
      }
    });

    db.ref("projects").on("value", snap => {
      projectsMap = snap.val() || {};
    });

    db.ref("purchases").on("value", snapshot => {
      const list = document.getElementById('requestsList');
      list.innerHTML = '';
      const data = snapshot.val();
      let pendingCount = 0, totalRevenue = 0;
      if (data) {
        Object.keys(data).forEach(key => {
          const req = { id: key, ...data[key] };
          const p = projectsMap[req.projectId] || { title: req.isAiPremium ? '🤖 AI PRO Obuna' : 'Loyiha', price: req.finalPrice || 0 };
          if (req.status === 'pending') pendingCount++;
          if (req.status === 'approved') totalRevenue += Number(req.finalPrice || p.price || 0);
          
          let statusBadge = req.status === 'pending' ? '<span class="text-amber-400 font-bold">KUTILMOQDA</span>' : (req.status === 'approved' ? '<span class="text-emerald-400 font-bold">TASDIQLANGAN</span>' : '<span class="text-rose-400 font-bold">RAD ETILGAN</span>');
          let receiptImg = req.receiptImage ? `<a href="${req.receiptImage}" target="_blank"><img src="${req.receiptImage}" class="w-full h-20 object-cover rounded-xl mt-2 border border-slate-700"></a>` : '';

          list.innerHTML += `
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-xs space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <div class="font-bold text-white text-sm">${req.studentName}</div>
                  <div class="text-indigo-300 font-semibold text-[11px] mt-1">${p.title} (${Number(req.finalPrice || p.price).toLocaleString()} UZS)</div>
                </div>
                <div>${statusBadge}</div>
              </div>
              ${receiptImg}
              <div class="flex gap-2 pt-1">
                ${req.status === 'pending' ? `
                  <button onclick="db.ref('purchases/${req.id}').update({status: 'approved'}); showToast('Ruxsat berildi!', 'emerald')" class="flex-1 bg-emerald-600 py-2 rounded-xl text-white font-bold text-[11px]">Ruxsat Berish</button>
                  <button onclick="db.ref('purchases/${req.id}').update({status: 'revoked'})" class="bg-rose-600 px-3 py-2 rounded-xl text-white font-bold text-[11px]">Rad Etish</button>
                ` : ``}
              </div>
            </div>
          `;
        });
      }
      document.getElementById('statPending').innerText = pendingCount;
      document.getElementById('statRevenue').innerText = totalRevenue.toLocaleString() + " UZS";
    });
  </script>
</body>
</html>

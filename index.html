<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Global</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #090d16; color: #f8fafc; font-family: sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="pb-12">

  <header class="sticky top-0 z-40 glass px-4 py-4 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <span class="bg-emerald-500/20 text-emerald-400 p-2 rounded-xl"><i class="fa-solid fa-user-shield text-lg"></i></span>
      <h1 class="text-base font-bold text-white">Global Admin Panel</h1>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
    <!-- Loyiha qo'shish -->
    <div class="glass p-5 rounded-3xl border border-slate-800">
      <h2 class="text-sm font-bold text-white mb-4"><i class="fa-solid fa-plus text-indigo-400 mr-2"></i> Yangi Loyiha Qo'shish</h2>
      <form onsubmit="addProject(event)" class="space-y-3">
        <input type="text" id="pTitle" required placeholder="Loyiha Nomi" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="pCategory" placeholder="Kategoriya (Masalan: Veb-sayt)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
          <input type="number" id="pPrice" required placeholder="Narxi (UZS)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <input type="url" id="pFileUrl" required placeholder="Fayl havolasi (Google Drive / Telegram link)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        <textarea id="pDesc" rows="2" placeholder="Tavsif" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"></textarea>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs transition">Barchaga E'lon Qilish</button>
      </form>
    </div>

    <!-- Kelib tushgan to'lovlar -->
    <div class="glass p-5 rounded-3xl border border-slate-800">
      <h2 class="text-sm font-bold text-white mb-4"><i class="fa-solid fa-clock-rotate-left text-amber-400 mr-2"></i> To'lov So'rovlari</h2>
      <div id="requestsList" class="space-y-3">
        <div class="text-center text-slate-500 text-xs">Yuklanmoqda...</div>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "SIZNING_API_KEY",
      authDomain: "SIZNING_DOMAIN.firebaseapp.com",
      projectId: "SIZNING_PROJECT_ID",
      storageBucket: "SIZNING_BUCKET.appspot.com",
      messagingSenderId: "ID",
      appId: "APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function addProject(e) {
      e.preventDefault();
      db.collection("projects").add({
        title: document.getElementById('pTitle').value,
        category: document.getElementById('pCategory').value,
        price: Number(document.getElementById('pPrice').value),
        fileUrl: document.getElementById('pFileUrl').value,
        description: document.getElementById('pDesc').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("Loyiha butun dunyo uchun e'lon qilindi!");
        e.target.reset();
      });
    }

    // To'lovlarni real-time kuzatish
    db.collection("purchases").onSnapshot((snapshot) => {
      const reqList = document.getElementById('requestsList');
      reqList.innerHTML = '';
      let docs = [];
      snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));

      if (docs.length === 0) {
        reqList.innerHTML = `<div class="text-center py-4 text-slate-500 text-xs">Hozircha so'rovlar yo'q.</div>`;
        return;
      }

      docs.forEach(req => {
        let statusColor = req.status === 'pending' ? 'text-amber-400' : (req.status === 'approved' ? 'text-emerald-400' : 'text-rose-400');
        reqList.innerHTML += `
          <div class="bg-slate-900/90 p-3.5 rounded-2xl border border-slate-800 text-xs flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${req.studentName}</div>
              <div class="text-[10px] ${statusColor} font-semibold mt-1">Holat: ${req.status.toUpperCase()}</div>
            </div>
            ${req.status === 'pending' ? `
              <div class="flex space-x-1">
                <button onclick="updateStatus('${req.id}', 'approved')" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-white font-semibold text-[11px]">Ruxsat</button>
                <button onclick="updateStatus('${req.id}', 'rejected')" class="bg-rose-600 px-2 py-1.5 rounded-lg text-white font-semibold text-[11px]">Rad</button>
              </div>
            ` : ''}
          </div>
        `;
      });
    });

    function updateStatus(id, newStatus) {
      db.collection("purchases").doc(id).update({ status: newStatus });
    }
  </script>
</body>
</html>
